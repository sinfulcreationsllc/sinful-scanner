<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sinful Creations scanner</title><meta name="robots" content="noindex">
<style>
body{margin:0;font:16px system-ui,sans-serif;background:#1b1b1b;color:#f5e8d6}
header{padding:14px 16px}h1{font-family:Georgia,serif;font-weight:500;font-size:22px;margin:0}p{margin:6px 0;color:#b9aa98}
.v{position:relative;background:#000}video{display:block;width:100%;max-height:60vh;object-fit:cover}
.aim{position:absolute;left:10%;right:10%;top:32%;bottom:32%;border:2px solid #fff;border-radius:10px}
ul{list-style:none;margin:0;padding:8px 16px}li{padding:10px 0;border-bottom:1px solid #3a332b;font-size:18px}
li small{color:#b9aa98;font-size:13px}
.b{display:flex;gap:8px;padding:12px 16px}button{font:inherit;padding:10px 16px;border-radius:10px;border:0;background:#c9a36a;color:#1b1b1b}
button.g{background:transparent;color:#f5e8d6;border:1px solid #3a332b}
</style></head>
<body>
<header><h1>Sinful Creations scanner</h1><p id="m">Starting the camera…</p></header>
<div class="v"><video id="v" playsinline muted autoplay></video><div class="aim"></div></div>
<div class="b"><button id="d">Done, back to HQ</button><button class="g" id="c">Copy all</button></div>
<ul id="l"></ul>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* Stand-alone page opened from HQ (claude.ai blocks the camera inside HQ). Each code goes back to HQ with postMessage
   to the window that opened this tab, and is also kept in a list you can copy. No backtick strings here. */
var v = document.getElementById('v'), m = document.getElementById('m'), l = document.getElementById('l');
var last = '', lastAt = 0, all = [];
var topic = (location.search.match(/[?&]t=([A-Za-z0-9_-]{16,64})/) || [])[1] || '';
function relay(c, n) { if (!topic) return Promise.resolve(false);
  return fetch('https://ntfy.sh/' + topic, { method: 'POST', body: JSON.stringify({ code: c, name: n || '' }) }).then(function (r) { return r.ok; }).catch(function () { return false; }); }

/* Look a barcode up in several free product databases, food and non-food, trying UPC and EAN forms. */
function variants(c) { var v = [c]; if (/^\d{12}$/.test(c)) v.push('0' + c); if (/^0\d{12}$/.test(c)) v.push(c.slice(1)); return v; }
function getJson(u) { return fetch(u).then(function (r) { if (!r.ok) throw 0; return r.json(); }); }
function offLike(host, code) {
  return getJson('https://' + host + '/api/v2/product/' + encodeURIComponent(code) + '.json?fields=product_name,product_name_en,generic_name,brands,quantity')
    .then(function (j) { var p = j && j.product; var n = p && (p.product_name || p.product_name_en || p.generic_name); if (!n) throw 0;
      return [String(p.brands || '').split(',')[0].trim(), n, p.quantity].filter(Boolean).join(' · '); }); }
function upcitemdb(code) {
  return getJson('https://api.upcitemdb.com/prod/trial/lookup?upc=' + encodeURIComponent(code))
    .then(function (j) { var it = j && j.items && j.items[0]; if (!it || !it.title) throw 0;
      var t = it.title, b = it.brand && t.toLowerCase().indexOf(String(it.brand).toLowerCase()) < 0 ? it.brand : '';
      return [b, t, it.size && t.indexOf(it.size) < 0 ? it.size : ''].filter(Boolean).join(' · '); }); }
function firstOf(fns) { var i = 0; function next() { if (i >= fns.length) return Promise.resolve(''); var f = fns[i++]; return f().catch(next); } return next(); }
function lookup(c) {
  var fns = [];
  variants(c).forEach(function (v) { fns.push(function () { return offLike('world.openfoodfacts.org', v); }); });
  variants(c).forEach(function (v) { fns.push(function () { return upcitemdb(v); }); });
  variants(c).forEach(function (v) { fns.push(function () { return offLike('world.openproductsfacts.org', v); }); });
  return firstOf(fns);
}
function hq() { var o = null; try { o = window.top.opener; } catch (e) {} if (!o) { try { o = window.opener; } catch (e) {} } return o; }
document.getElementById('d').onclick = function () { try { var o = hq(); if (o) o.focus(); } catch (e) {} try { window.top.close(); } catch (e) {} };
document.getElementById('c').onclick = function () {
  var t = all.join('\n'); try { navigator.clipboard.writeText(t); m.textContent = 'Copied ' + all.length + ' code(s). Paste them in HQ.'; } catch (e) { m.textContent = t; } };
function got(c) {
  var n = Date.now(); if (!c || (c === last && n - lastAt < 2500)) return; last = c; lastAt = n;
  try { if (navigator.vibrate) navigator.vibrate(80); } catch (e) {}
  var sent = !!topic, o = hq(); if (o) { try { o.postMessage({ hqscan: c }, '*'); sent = true; } catch (e) {} }
  all.push(c);
  var li = document.createElement('li'); li.textContent = c + ' ';
  var s = document.createElement('small'); s.textContent = sent ? 'sending to HQ…' : 'tap Copy all, then paste in HQ'; li.appendChild(s);
  l.insertBefore(li, l.firstChild);
  m.textContent = 'Scanned ' + c + '. Looking it up…';
  var nm = document.createElement('div'); nm.style.cssText = 'font-size:15px;color:#c9a36a;margin-top:2px'; li.appendChild(nm);
  lookup(c).then(function (n) {
      nm.textContent = n || 'Not found in the product databases. Type the name in HQ once; HQ remembers it.';
      if (n && o) { try { o.postMessage({ hqscan: c, name: n }, '*'); } catch (e) {} }
      relay(c, n).then(function (ok) { if (topic) s.textContent = ok ? 'sent to HQ' : 'could not send, tap Copy all'; });
      m.textContent = (n ? 'Found: ' + n : 'Scanned ' + c) + '. Scan the next one, or tap Done.';
    });
}
if (!hq() && !topic) { var w = document.createElement('p'); w.style.cssText = 'color:#f09a6a;margin:0;padding:0 16px 8px'; w.textContent = 'Not connected to HQ. To send scans to HQ automatically, open this from HQ: Inventory, then Scan barcode.'; document.querySelector('header').appendChild(w); }
navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' } }, audio: false }).then(function (st) {
  v.srcObject = st; v.play(); m.textContent = 'Hold a barcode inside the box. It scans by itself.';
  if ('BarcodeDetector' in window) {
    var bd = new BarcodeDetector();
    (function t() { if (v.readyState >= 2) bd.detect(v).then(function (r) { if (r[0]) got(r[0].rawValue); }).catch(function () {}); setTimeout(t, 200); })();
    return;
  }
  if (!window.ZXing) { m.textContent = 'Could not load the scanner. Check your connection and reload.'; return; }
  new ZXing.BrowserMultiFormatReader().decodeFromStream(st, v, function (r) { if (r) got(r.getText()); });
}).catch(function (e) {
  m.textContent = 'The camera was blocked (' + e.name + '). Allow the camera for this browser in your phone settings, then reload.';
});
</script>
</body></html>
